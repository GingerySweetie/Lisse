name = "lisse"
compatibility_date = "2026-01-01"
main = "worker/index.ts"

# Static SPA + Worker (Cursor API same-origin reverse proxy).
# Works for Workers + Static Assets; Pages can use the same wrangler deploy.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Ensure /proxy/cursor hits the Worker before SPA fallback serves index.html.
run_worker_first = ["/proxy/cursor", "/proxy/cursor/*"]
